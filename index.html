<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vixel_Craft</title>
<style>
:root {
  --bg: #0a0e1a;
  --panel: rgba(15, 20, 35, 0.92);
  --border: rgba(100, 180, 255, 0.3);
  --accent: #00d4ff;
  --gold: #ffd700;
  --text: #e0e8f5;
  --dim: #7a8aa0;
  --font: 'Courier New', ui-monospace, monospace;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#000;
  font-family: var(--font); color: var(--text); user-select:none; -webkit-user-select:none;
  touch-action: none; }
#cv { display:block; position:fixed; inset:0; width:100vw; height:100vh; cursor: crosshair; }

/* Hotbar */
#hotbar {
  position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 4px; padding: 8px;
  background: var(--panel); border-radius: 12px;
  border: 1px solid var(--border);
  backdrop-filter: blur(8px);
  z-index: 10;
}
.slot {
  width: 44px; height: 44px; border-radius: 8px;
  background: rgba(255,255,255,0.05);
  border: 1.5px solid rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;
  position: relative; cursor: pointer; transition: all 0.15s;
  flex-shrink: 0;
}
.slot.active {
  border-color: var(--accent);
  box-shadow: 0 0 12px rgba(0, 212, 255, 0.6);
  transform: translateY(-4px);
}
.slot-icon {
  width: 28px; height: 28px; border-radius: 4px;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,0.25), inset 0 2px 0 rgba(255,255,255,0.15);
}
.slot-count {
  position: absolute; bottom: 2px; left: 4px;
  font-size: 11px; font-weight: bold;
  color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000;
}
.slot-num {
  position: absolute; top: 1px; right: 4px;
  font-size: 9px; color: var(--dim);
}

/* Top info */
#topinfo {
  position: fixed; top: 12px; left: 12px; right: 12px;
  display: flex; justify-content: space-between; align-items: flex-start;
  z-index: 10; pointer-events: none;
}
.info-box {
  background: var(--panel); padding: 8px 14px; border-radius: 10px;
  border: 1px solid var(--border); backdrop-filter: blur(8px);
  font-size: 12px; pointer-events: auto;
}
.info-box b { color: var(--accent); }

/* Buttons */
.tbtn {
  background: var(--panel); border: 1px solid var(--border);
  color: var(--text); padding: 8px 14px; border-radius: 8px;
  font-family: inherit; font-size: 12px; font-weight: bold;
  cursor: pointer; backdrop-filter: blur(8px);
  transition: all 0.15s; pointer-events: auto;
}
.tbtn:hover { border-color: var(--accent); color: var(--accent); }
.tbtn:active { transform: scale(0.95); }

/* Crafting menu */
#craftMenu {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(4, 8, 18, 0.9);
  backdrop-filter: blur(10px);
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 20px;
}
#craftMenu.show { display: flex; }
#craftMenu h2 {
  font-size: 24px; color: var(--accent); letter-spacing: 4px;
  margin-bottom: 16px; text-shadow: 0 0 20px rgba(0,212,255,0.6);
}
.recipe-list {
  display: flex; flex-direction: column; gap: 10px;
  max-width: 480px; width: 100%;
}
.recipe {
  background: rgba(20, 30, 50, 0.8);
  border: 1.5px solid rgba(100, 180, 255, 0.25);
  border-radius: 12px; padding: 12px 16px;
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; transition: all 0.15s;
}
.recipe:hover { border-color: var(--accent); background: rgba(20, 40, 70, 0.9); }
.recipe-info { flex: 1; min-width: 0; text-align: right; }
.recipe-name { font-size: 14px; font-weight: bold; margin-bottom: 4px; }
.recipe-ing { font-size: 11px; color: var(--dim); }
.craft-btn {
  padding: 8px 18px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), #0088cc);
  color: #001520; font-weight: bold; font-size: 12px;
  border: none; cursor: pointer; font-family: inherit;
  transition: all 0.15s; flex-shrink: 0;
}
.craft-btn:hover { box-shadow: 0 0 20px rgba(0,212,255,0.6); }
.craft-btn:disabled {
  background: #2a3242; color: #6b7a8d; cursor: not-allowed;
  box-shadow: none;
}

/* Help overlay */
#help {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(4, 8, 18, 0.96);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px; text-align: center;
}
#help h1 {
  font-size: clamp(48px, 14vw, 96px); font-weight: 900;
  letter-spacing: 6px; color: #fff; margin-bottom: 6px;
  text-shadow: 0 0 30px var(--accent), 0 0 60px rgba(0,212,255,0.5);
}
#help h1 span { color: var(--accent); }
#help .subtitle {
  font-size: 14px; letter-spacing: 8px; color: var(--accent);
  margin-bottom: 30px;
}
#help .controls {
  font-size: 13px; line-height: 2.2; color: var(--dim);
  max-width: 400px; margin-bottom: 24px;
}
#help .controls kbd {
  background: rgba(255,255,255,0.1);
  padding: 2px 8px; border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.2);
  font-family: inherit; font-size: 11px;
  color: var(--text);
}
#help .bigbtn {
  padding: 14px 48px; border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), #0088cc);
  color: #001520; font-weight: bold; font-size: 16px;
  letter-spacing: 3px; border: none; cursor: pointer;
  font-family: inherit;
  box-shadow: 0 0 30px rgba(0,212,255,0.4);
  transition: transform 0.1s;
}
#help .bigbtn:active { transform: scale(0.95); }

/* Toast */
#toast {
  position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
  background: rgba(0, 212, 255, 0.15); border: 1.5px solid var(--accent);
  color: var(--accent); padding: 10px 22px; border-radius: 10px;
  font-size: 13px; font-weight: bold;
  opacity: 0; transition: opacity 0.3s;
  z-index: 150; pointer-events: none;
}
#toast.show { opacity: 1; }

/* Mobile buttons */
.mbtn {
  position: fixed; width: 64px; height: 64px;
  border-radius: 50%; background: rgba(0,0,0,0.4);
  border: 2px solid var(--accent); color: var(--accent);
  font-size: 24px; font-weight: bold; z-index: 15;
  touch-action: none; user-select: none;
  display: none; align-items: center; justify-content: center;
  padding: 0;
}
body.touch .mbtn { display: flex; }
.mbtn.active { background: rgba(0,212,255,0.3); }
#mLeft { bottom: 90px; left: 20px; }
#mRight { bottom: 90px; left: 100px; }
#mJump { bottom: 90px; right: 20px; }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="topinfo">
  <div class="info-box" id="coords">X: <b>0</b> Y: <b>0</b></div>
  <div style="display:flex;gap:8px;pointer-events:auto;">
    <button class="tbtn" id="craftBtn">🔨 صناعة</button>
    <button class="tbtn" id="saveBtn">💾 حفظ</button>
  </div>
</div>

<div id="hotbar"></div>
<div id="toast"></div>

<button class="mbtn" id="mLeft">◀</button>
<button class="mbtn" id="mRight">▶</button>
<button class="mbtn" id="mJump">▲</button>

<div id="craftMenu">
  <h2>🔨 ورشة الصناعة</h2>
  <div class="recipe-list" id="recipeList"></div>
  <button class="tbtn" id="closeCraftBtn" style="margin-top:20px;">إغلاق (C)</button>
</div>

<div id="help">
  <h1>V<span>I</span>XEL</h1>
  <div class="subtitle">C R A F T</div>
  <div class="controls">
    <kbd>A</kbd> <kbd>D</kbd> أو <kbd>←</kbd> <kbd>→</kbd> للحركة<br>
    <kbd>W</kbd> أو <kbd>Space</kbd> للقفز<br>
    <b style="color:var(--accent)">انقر يسارًا</b> لتعدين الطوب<br>
    <b style="color:var(--accent)">انقر يمينًا</b> لوضع الطوب المحدد<br>
    <kbd>1</kbd>–<kbd>9</kbd> لاختيار من الشريط السفلي<br>
    <kbd>C</kbd> لفتح ورشة الصناعة
  </div>
  <button class="bigbtn" id="startBtn">ابدأ اللعب</button>
</div>

<script>
"use strict";

/* =========================================================
   VIXEL_CRAFT — 2D voxel mining & crafting
   ========================================================= */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize);
resize();

/* -------- constants -------- */
const TILE = 24;
const WORLD_W = 200;
const WORLD_H = 100;

const T = {
  AIR:0, GRASS:1, DIRT:2, STONE:3,
  COAL:4, IRON:5, GOLD:6, DIAMOND:7,
  WOOD:8, LEAVES:9, BEDROCK:10,
  PLANK:11, TORCH:12
};

const TILE_INFO = {
  [T.GRASS]:   { name:'عشب',   c:'#5BAE3C', c2:'#3A7A28', hard:0.5 },
  [T.DIRT]:    { name:'تراب',  c:'#8B5A2B', c2:'#5A3A1A', hard:0.5 },
  [T.STONE]:   { name:'حجر',   c:'#7A7A7A', c2:'#5A5A5A', hard:1.3 },
  [T.COAL]:    { name:'فحم',   c:'#3A3A3A', c2:'#1A1A1A', hard:2.0 },
  [T.IRON]:    { name:'حديد',  c:'#C89060', c2:'#7A5030', hard:2.4 },
  [T.GOLD]:    { name:'ذهب',   c:'#FFD700', c2:'#A08000', hard:3.2 },
  [T.DIAMOND]: { name:'ألماس', c:'#00E5FF', c2:'#0088AA', hard:4.0 },
  [T.WOOD]:    { name:'خشب',   c:'#6B4423', c2:'#4A2810', hard:0.8 },
  [T.LEAVES]:  { name:'أوراق', c:'#3A8A3A', c2:'#1A5A1A', hard:0.2 },
  [T.BEDROCK]: { name:'صخر',   c:'#1A1A1A', c2:'#000000', hard:Infinity },
  [T.PLANK]:   { name:'ألواح', c:'#B07040', c2:'#7A4010', hard:0.6 },
  [T.TORCH]:   { name:'مشعل',  c:'#FFA500', c2:'#FF5500', hard:0.1 }
};

const RECIPES = [
  { in: { [T.WOOD]:1 }, out: { [T.PLANK]:4 }, name:'ألواح خشبية ×4' },
  { in: { [T.PLANK]:1, [T.COAL]:1 }, out: { [T.TORCH]:4 }, name:'مشاعل ×4' }
];

/* -------- state -------- */
const G = {
  world: [],
  heights: [],
  player: { x:0, y:0, vx:0, vy:0, w:16, h:28, onGround:false, facing:1 },
  cam: { x:0, y:0 },
  inv: {},
  hotbar: new Array(9).fill(T.AIR),
  sel: 0,
  mining: { x:-1, y:-1, progress:0 },
  keys: {},
  mouse: { x:0, y:0, down:false },
  craftOpen: false,
  started: false,
  time: 0
};

/* -------- world generation -------- */
function generateWorld() {
  G.world = [];
  for (let y = 0; y < WORLD_H; y++) {
    G.world[y] = new Array(WORLD_W).fill(T.AIR);
  }
  G.heights = [];

  for (let x = 0; x < WORLD_W; x++) {
    let h = 30;
    h += Math.sin(x * 0.08) * 4;
    h += Math.sin(x * 0.19) * 2;
    h += Math.sin(x * 0.03) * 6;
    h = Math.floor(h);
    if (h < 15) h = 15;
    if (h > WORLD_H - 20) h = WORLD_H - 20;
    G.heights.push(h);
  }

  for (let x = 0; x < WORLD_W; x++) {
    const h = G.heights[x];
    G.world[h][x] = T.GRASS;
    for (let y = h + 1; y < WORLD_H; y++) {
      if (y >= WORLD_H - 2) {
        G.world[y][x] = T.BEDROCK;
      } else if (y < h + 4) {
        G.world[y][x] = T.DIRT;
      } else {
        G.world[y][x] = T.STONE;
      }
    }
  }

  const ores = [
    { t:T.COAL,    minY:5,  maxY:WORLD_H-4, chance:0.04 },
    { t:T.IRON,    minY:15, maxY:WORLD_H-4, chance:0.02 },
    { t:T.GOLD,    minY:30, maxY:WORLD_H-4, chance:0.008 },
    { t:T.DIAMOND, minY:50, maxY:WORLD_H-4, chance:0.004 }
  ];
  for (const ore of ores) {
    const count = Math.floor(WORLD_W * (ore.maxY - ore.minY) * ore.chance * 0.5);
    for (let i = 0; i < count; i++) {
      const x = Math.floor(Math.random() * WORLD_W);
      const y = ore.minY + Math.floor(Math.random() * (ore.maxY - ore.minY));
      if (y > G.heights[x] + 4 && G.world[y][x] === T.STONE) {
        G.world[y][x] = ore.t;
      }
    }
  }

  for (let x = 6; x < WORLD_W - 6; x += 6 + Math.floor(Math.random() * 6)) {
    const h = G.heights[x];
    const trunkH = 3 + Math.floor(Math.random() * 3);
    for (let i = 1; i <= trunkH; i++) {
      if (h - i >= 0) G.world[h - i][x] = T.WOOD;
    }
    const topY = h - trunkH;
    for (let dy = -2; dy <= 0; dy++) {
      for (let dx = -2; dx <= 2; dx++) {
        if (dy === -2 && Math.abs(dx) > 1) continue;
        const lx = x + dx, ly = topY + dy;
        if (lx >= 0 && lx < WORLD_W && ly >= 0 && ly < WORLD_H) {
          if (G.world[ly][lx] === T.AIR && Math.random() < 0.85) {
            G.world[ly][lx] = T.LEAVES;
          }
        }
      }
    }
  }

  // pick clear spawn
  let spawnX = Math.floor(WORLD_W / 2);
  let attempts = 0;
  while (attempts < 200) {
    const hy = G.heights[spawnX];
    if (G.world[hy - 1][spawnX] === T.AIR && G.world[hy - 2][spawnX] === T.AIR) break;
    spawnX++;
    if (spawnX >= WORLD_W - 5) spawnX = 5;
    attempts++;
  }
  G.player.x = spawnX * TILE + (TILE - G.player.w) / 2;
  G.player.y = G.heights[spawnX] * TILE - G.player.h - 4;
  G.player.vx = 0; G.player.vy = 0;
  G.player.onGround = false;

  G.inv = { [T.TORCH]: 10 };
  G.hotbar = [T.TORCH, T.AIR, T.AIR, T.AIR, T.AIR, T.AIR, T.AIR, T.AIR, T.AIR];
  G.sel = 0;
}

/* -------- helpers -------- */
function isSolid(t) { return t !== T.AIR && t !== T.TORCH; }

function getTile(tx, ty) {
  if (tx < 0 || tx >= WORLD_W || ty < 0 || ty >= WORLD_H) return T.BEDROCK;
  return G.world[ty][tx];
}
function setTile(tx, ty, t) {
  if (tx < 0 || tx >= WORLD_W || ty < 0 || ty >= WORLD_H) return;
  G.world[ty][tx] = t;
}

function collides(x, y, w, h) {
  const x1 = Math.floor(x / TILE);
  const x2 = Math.floor((x + w - 1) / TILE);
  const y1 = Math.floor(y / TILE);
  const y2 = Math.floor((y + h - 1) / TILE);
  for (let ty = y1; ty <= y2; ty++) {
    for (let tx = x1; tx <= x2; tx++) {
      if (isSolid(getTile(tx, ty))) return true;
    }
  }
  return false;
}

function addItem(t, n) {
  if (n === undefined) n = 1;
  G.inv[t] = (G.inv[t] || 0) + n;
  if (!G.hotbar.includes(t)) {
    const idx = G.hotbar.indexOf(T.AIR);
    if (idx >= 0) G.hotbar[idx] = t;
  }
  updateHotbarUI();
}

function removeItem(t, n) {
  if (n === undefined) n = 1;
  if (!G.inv[t] || G.inv[t] < n) return false;
  G.inv[t] -= n;
  if (G.inv[t] <= 0) {
    delete G.inv[t];
    const idx = G.hotbar.indexOf(t);
    if (idx >= 0) G.hotbar[idx] = T.AIR;
  }
  updateHotbarUI();
  return true;
}

function inReach(tx, ty) {
  const px = G.player.x + G.player.w / 2;
  const py = G.player.y + G.player.h / 2;
  const cx = tx * TILE + TILE / 2;
  const cy = ty * TILE + TILE / 2;
  return Math.hypot(cx - px, cy - py) < TILE * 5.5;
}

/* -------- UI -------- */
const hotbarEl = document.getElementById('hotbar');
const coordsEl = document.getElementById('coords');
const toastEl = document.getElementById('toast');
const craftMenu = document.getElementById('craftMenu');
const recipeList = document.getElementById('recipeList');

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1600);
}

function updateHotbarUI() {
  let html = '';
  for (let i = 0; i < 9; i++) {
    const t = G.hotbar[i];
    const info = TILE_INFO[t];
    const count = t && G.inv[t] ? G.inv[t] : 0;
    const color = info ? info.c : 'transparent';
    html += `<div class="slot ${i === G.sel ? 'active' : ''}" data-slot="${i}">
      <span class="slot-num">${i+1}</span>
      ${t ? `<div class="slot-icon" style="background:${color}"></div>` : ''}
      ${t && count > 0 ? `<span class="slot-count">${count}</span>` : ''}
    </div>`;
  }
  hotbarEl.innerHTML = html;
  hotbarEl.querySelectorAll('.slot').forEach(s => {
    s.addEventListener('mousedown', e => {
      e.stopPropagation();
      G.sel = parseInt(s.dataset.slot);
      updateHotbarUI();
    });
    s.addEventListener('touchstart', e => {
      e.stopPropagation();
      G.sel = parseInt(s.dataset.slot);
      updateHotbarUI();
    }, { passive: true });
  });
}

function openCraft() {
  G.craftOpen = true;
  renderRecipes();
  craftMenu.classList.add('show');
}
function closeCraft() {
  G.craftOpen = false;
  craftMenu.classList.remove('show');
}
function renderRecipes() {
  let html = '';
  for (let i = 0; i < RECIPES.length; i++) {
    const r = RECIPES[i];
    let ingHtml = [];
    let canCraft = true;
    for (const t in r.in) {
      const need = r.in[t];
      const have = G.inv[t] || 0;
      if (have < need) canCraft = false;
      ingHtml.push(`<span style="color:${have >= need ? '#5dff8f' : '#ff5555'}">${TILE_INFO[t].name} ${have}/${need}</span>`);
    }
    html += `<div class="recipe">
      <div class="recipe-info">
        <div class="recipe-name">${r.name}</div>
        <div class="recipe-ing">${ingHtml.join(' • ')}</div>
      </div>
      <button class="craft-btn" data-i="${i}" ${canCraft ? '' : 'disabled'}>صناعة</button>
    </div>`;
  }
  recipeList.innerHTML = html;
  recipeList.querySelectorAll('.craft-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const r = RECIPES[parseInt(btn.dataset.i)];
      for (const t in r.in) if ((G.inv[t] || 0) < r.in[t]) return;
      for (const t in r.in) removeItem(t, r.in[t]);
      for (const t in r.out) addItem(t, r.out[t]);
      showToast('✅ تمت الصناعة: ' + r.name);
      renderRecipes();
    });
  });
}

/* -------- input -------- */
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  G.keys[e.code] = true;
  if (e.code === 'KeyC') {
    if (G.craftOpen) closeCraft(); else openCraft();
  }
  if (e.code.startsWith('Digit')) {
    const n = parseInt(e.code.slice(5));
    if (n >= 1 && n <= 9) { G.sel = n - 1; updateHotbarUI(); }
  }
  if (e.code === 'Escape' && G.craftOpen) closeCraft();
});
addEventListener('keyup', e => { G.keys[e.code] = false; });

cv.addEventListener('mousemove', e => {
  G.mouse.x = e.clientX;
  G.mouse.y = e.clientY;
});
cv.addEventListener('mousedown', e => {
  if (!G.started || G.craftOpen) return;
  if (e.button === 0) {
    G.mouse.down = true;
    startMining(e.clientX, e.clientY);
  } else if (e.button === 2) {
    tryPlaceBlock(e.clientX, e.clientY);
  }
});
cv.addEventListener('mouseup', e => {
  if (e.button === 0) { G.mouse.down = false; stopMining(); }
});
cv.addEventListener('contextmenu', e => e.preventDefault());

cv.addEventListener('touchstart', e => {
  if (!G.started || G.craftOpen) return;
  e.preventDefault();
  const t = e.changedTouches[0];
  const tx = Math.floor((t.clientX + G.cam.x) / TILE);
  const ty = Math.floor((t.clientY + G.cam.y) / TILE);
  if (!inReach(tx, ty)) return;
  if (isSolid(getTile(tx, ty))) startMining(t.clientX, t.clientY);
  else tryPlaceBlock(t.clientX, t.clientY);
}, { passive: false });
cv.addEventListener('touchend', e => {
  stopMining();
}, { passive: false });
cv.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

function startMining(cx, cy) {
  const tx = Math.floor((cx + G.cam.x) / TILE);
  const ty = Math.floor((cy + G.cam.y) / TILE);
  if (!inReach(tx, ty)) return;
  const t = getTile(tx, ty);
  if (t === T.AIR || t === T.BEDROCK) return;
  G.mining.x = tx;
  G.mining.y = ty;
  G.mining.progress = 0;
}
function stopMining() {
  G.mining.x = -1; G.mining.y = -1; G.mining.progress = 0;
}
function tryPlaceBlock(cx, cy) {
  const t = G.hotbar[G.sel];
  if (!t || t === T.AIR) return;
  if (!G.inv[t] || G.inv[t] <= 0) { showToast('لا تملك هذا الطوب!'); return; }
  const tx = Math.floor((cx + G.cam.x) / TILE);
  const ty = Math.floor((cy + G.cam.y) / TILE);
  if (!inReach(tx, ty)) return;
  if (getTile(tx, ty) !== T.AIR) return;

  let hasSupport = false;
  for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
    if (isSolid(getTile(tx+dx, ty+dy))) { hasSupport = true; break; }
  }
  if (!hasSupport) return;

  const px = G.player.x / TILE, py = G.player.y / TILE;
  const pw = G.player.w / TILE, ph = G.player.h / TILE;
  if (tx + 1 > px && tx < px + pw && ty + 1 > py && ty < py + ph) return;

  setTile(tx, ty, t);
  removeItem(t, 1);
}

/* mobile buttons */
function bindMobileBtn(id, code) {
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', e => {
    e.preventDefault();
    G.keys[code] = true;
    btn.classList.add('active');
  }, { passive: false });
  btn.addEventListener('touchend', e => {
    e.preventDefault();
    G.keys[code] = false;
    btn.classList.remove('active');
  }, { passive: false });
  btn.addEventListener('touchcancel', e => {
    G.keys[code] = false;
    btn.classList.remove('active');
  }, { passive: true });
}
bindMobileBtn('mLeft', 'ArrowLeft');
bindMobileBtn('mRight', 'ArrowRight');
bindMobileBtn('mJump', 'Space');

/* -------- physics -------- */
const GRAVITY = 900;
const MOVE_SPEED = 210;
const JUMP_VEL = -340;

function update(dt) {
  const p = G.player;

  let vx = 0;
  if (G.keys['ArrowLeft'] || G.keys['KeyA']) vx -= 1;
  if (G.keys['ArrowRight'] || G.keys['KeyD']) vx += 1;
  if (vx !== 0) p.facing = vx;
  p.vx = vx * MOVE_SPEED;

  p.vy += GRAVITY * dt;
  if (p.vy > 900) p.vy = 900;

  const jumpPressed = G.keys['ArrowUp'] || G.keys['KeyW'] || G.keys['Space'];
  if (jumpPressed && p.onGround) {
    p.vy = JUMP_VEL;
    p.onGround = false;
  }

  const newX = p.x + p.vx * dt;
  if (!collides(newX, p.y, p.w, p.h)) p.x = newX;
  else if (!collides(newX, p.y - 1, p.w, p.h) && p.onGround) { p.y -= 1; p.x = newX; }

  const newY = p.y + p.vy * dt;
  if (!collides(p.x, newY, p.w, p.h)) {
    p.y = newY;
    p.onGround = false;
  } else {
    if (p.vy > 0) p.onGround = true;
    p.vy = 0;
  }

  p.x = Math.max(0, Math.min((WORLD_W - 1) * TILE - p.w, p.x));
  p.y = Math.max(0, Math.min((WORLD_H - 1) * TILE - p.h, p.y));

  const tcx = p.x + p.w/2 - W/2;
  const tcy = p.y + p.h/2 - H/2;
  G.cam.x += (tcx - G.cam.x) * Math.min(1, dt * 10);
  G.cam.y += (tcy - G.cam.y) * Math.min(1, dt * 10);
  G.cam.x = Math.max(0, Math.min(WORLD_W * TILE - W, G.cam.x));
  G.cam.y = Math.max(0, Math.min(WORLD_H * TILE - H, G.cam.y));

  if (G.mining.x >= 0) {
    const t = getTile(G.mining.x, G.mining.y);
    if (t === T.AIR || t === T.BEDROCK) stopMining();
    else {
      const info = TILE_INFO[t];
      G.mining.progress += dt / info.hard;
      if (G.mining.progress >= 1) {
        setTile(G.mining.x, G.mining.y, T.AIR);
        addItem(t, 1);
        showToast('+' + info.name);
        stopMining();
      }
    }
  }

  coordsEl.innerHTML = `X: <b>${Math.floor(p.x / TILE)}</b> Y: <b>${Math.floor(p.y / TILE)}</b>`;
  G.time += dt;
}

/* -------- rendering -------- */
function drawTile(sx, sy, t) {
  const info = TILE_INFO[t];
  if (!info) return;

  ctx.fillStyle = info.c;
  ctx.fillRect(sx, sy, TILE, TILE);

  ctx.fillStyle = info.c2;
  ctx.fillRect(sx, sy + TILE * 0.7, TILE, TILE * 0.3);
  ctx.fillRect(sx + TILE * 0.7, sy, TILE * 0.3, TILE * 0.7);

  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(sx, sy, TILE, 2);
  ctx.fillRect(sx, sy, 2, TILE);

  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(sx + 0.5, sy + 0.5, TILE - 1, TILE - 1);

  if (t === T.LEAVES) {
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(sx + 5, sy + 5, 3, 3);
    ctx.fillRect(sx + 15, sy + 12, 3, 3);
    ctx.fillRect(sx + 10, sy + 18, 3, 3);
  }
  if (t === T.COAL || t === T.IRON || t === T.GOLD || t === T.DIAMOND) {
    ctx.fillStyle = info.c;
    ctx.beginPath();
    ctx.arc(sx + 8, sy + 8, 3, 0, Math.PI*2);
    ctx.arc(sx + 16, sy + 14, 2.5, 0, Math.PI*2);
    ctx.arc(sx + 10, sy + 17, 2, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(sx + 7, sy + 6, 2, 2);
    ctx.fillRect(sx + 15, sy + 12, 1.5, 1.5);
  }
  if (t === T.TORCH) {
    const cx = sx + TILE / 2;
    const cy = sy + TILE / 2;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, TILE * 3);
    grad.addColorStop(0, 'rgba(255,180,60,0.35)');
    grad.addColorStop(1, 'rgba(255,180,60,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(cx - TILE*3, cy - TILE*3, TILE*6, TILE*6);
    ctx.fillStyle = '#5A3010';
    ctx.fillRect(cx - 2, cy, 4, TILE/2 - 2);
    ctx.fillStyle = '#FFAA00';
    ctx.beginPath();
    ctx.arc(cx, cy - 3, 3 + Math.sin(G.time*8 + sx)*0.5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#FFEE00';
    ctx.beginPath();
    ctx.arc(cx, cy - 3, 1.5, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawPlayer() {
  const p = G.player;
  const sx = p.x - G.cam.x;
  const sy = p.y - G.cam.y;

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(sx + p.w/2, sy + p.h + 2, p.w/2, 3, 0, 0, Math.PI*2);
  ctx.fill();

  // body
  ctx.fillStyle = '#3D7BFF';
  ctx.fillRect(sx + 3, sy + 10, p.w - 6, p.h - 12);

  // pants
  ctx.fillStyle = '#2A4A8A';
  ctx.fillRect(sx + 3, sy + p.h - 6, p.w - 6, 6);

  // head
  ctx.fillStyle = '#F0C090';
  ctx.fillRect(sx + 2, sy, p.w - 4, 12);

  // hair
  ctx.fillStyle = '#3A2010';
  ctx.fillRect(sx + 2, sy, p.w - 4, 4);

  // eye
  ctx.fillStyle = '#000';
  const eyeX = p.facing > 0 ? sx + p.w - 6 : sx + 4;
  ctx.fillRect(eyeX, sy + 6, 2, 2);

  // arm
  ctx.fillStyle = '#3D7BFF';
  if (p.facing > 0) ctx.fillRect(sx + p.w - 3, sy + 14, 4, 8);
  else               ctx.fillRect(sx - 1, sy + 14, 4, 8);
}

function render() {
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#5BA5E5');
  skyGrad.addColorStop(0.5, '#8DC5F0');
  skyGrad.addColorStop(1, '#C5E5FA');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  if (!G.started) return;

  const startX = Math.max(0, Math.floor(G.cam.x / TILE));
  const endX = Math.min(WORLD_W, Math.ceil((G.cam.x + W) / TILE) + 1);
  const startY = Math.max(0, Math.floor(G.cam.y / TILE));
  const endY = Math.min(WORLD_H, Math.ceil((G.cam.y + H) / TILE) + 1);

  // underground fill
  for (let y = startY; y < endY; y++) {
    for (let x = startX; x < endX; x++) {
      if (y > G.heights[x]) {
        const sx = x * TILE - G.cam.x;
        const sy = y * TILE - G.cam.y;
        ctx.fillStyle = '#1a1510';
        ctx.fillRect(sx, sy, TILE, TILE);
      }
    }
  }

  // tiles
  for (let y = startY; y < endY; y++) {
    for (let x = startX; x < endX; x++) {
      const t = G.world[y][x];
      if (t === T.AIR) continue;
      drawTile(x * TILE - G.cam.x, y * TILE - G.cam.y, t);
    }
  }

  // mining overlay
  if (G.mining.x >= 0) {
    const sx = G.mining.x * TILE - G.cam.x;
    const sy = G.mining.y * TILE - G.cam.y;
    const pr = G.mining.progress;
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(sx, sy + TILE * (1 - pr), TILE, TILE * pr);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx + 1, sy + 1, TILE - 2, TILE - 2);
  }

  // hover
  if (G.mouse.x && !G.craftOpen) {
    const tx = Math.floor((G.mouse.x + G.cam.x) / TILE);
    const ty = Math.floor((G.mouse.y + G.cam.y) / TILE);
    if (inReach(tx, ty) && getTile(tx, ty) !== T.AIR) {
      const sx = tx * TILE - G.cam.x;
      const sy = ty * TILE - G.cam.y;
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(sx + 1, sy + 1, TILE - 2, TILE - 2);
    }
  }

  drawPlayer();
}

/* -------- save/load -------- */
function saveGame() {
  try {
    const data = {
      v: 1,
      world: G.world,
      player: { x: G.player.x, y: G.player.y },
      inv: G.inv,
      hotbar: G.hotbar,
      sel: G.sel
    };
    localStorage.setItem('vixel_craft_save', JSON.stringify(data));
    showToast('💾 تم الحفظ');
  } catch (e) {
    showToast('❌ فشل الحفظ');
  }
}

function loadGame() {
  try {
    const raw = localStorage.getItem('vixel_craft_save');
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data.world || !data.player) return false;
    G.world = data.world;
    G.player.x = data.player.x;
    G.player.y = data.player.y;
    G.player.vx = 0; G.player.vy = 0;
    G.inv = data.inv || {};
    G.hotbar = data.hotbar || new Array(9).fill(T.AIR);
    G.sel = data.sel || 0;
    G.heights = [];
    for (let x = 0; x < WORLD_W; x++) {
      let h = 0;
      for (let y = 0; y < WORLD_H; y++) {
        if (G.world[y][x] !== T.AIR) { h = y; break; }
      }
      G.heights.push(h);
    }
    return true;
  } catch (e) { return false; }
}

/* -------- boot -------- */
function boot() {
  generateWorld();
  updateHotbarUI();

  document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('help').style.display = 'none';
    G.started = true;
    if (loadGame()) {
      showToast('💾 تم تحميل الحفظ السابق');
      updateHotbarUI();
    }
  });

  document.getElementById('craftBtn').addEventListener('click', openCraft);
  document.getElementById('closeCraftBtn').addEventListener('click', closeCraft);
  document.getElementById('saveBtn').addEventListener('click', saveGame);

  setInterval(() => { if (G.started) saveGame(); }, 30000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && G.started) saveGame();
  });

  if (matchMedia('(pointer: coarse)').matches) {
    document.body.classList.add('touch');
  }
}

let lastTime = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastTime) lastTime = ts;
  let dt = (ts - lastTime) / 1000;
  lastTime = ts;
  if (dt > 0.05) dt = 0.05;
  if (G.started && !G.craftOpen) update(dt);
  render();
}

boot();
requestAnimationFrame(loop);
</script>
